<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #3B82F6;
      --color-primary-container:    #1E3A5F;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #0B1120;
      --color-surface-container-lowest:   #0F1729;
      --color-surface:                    #131C2E;
      --color-surface-container:          #1A2540;
      --color-surface-container-high:     #213052;
      --color-surface-container-highest:  #2A3B64;
      /* === 文字 === */
      --color-on-surface:           #CBD5E1;
      --color-on-surface-variant:   #64748B;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 数据高亮 === */
      --color-data:     #06B6D4;
      /* === 边框 === */
      --color-outline:          #1E293B;
      --color-outline-variant:  #1A2540;
      /* === 圆角 === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 8px rgba(0,0,0,0.3);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.4);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.5);
      /* === 字体 === */
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", monospace;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans min-h-screen">

  <!-- @nav:start 导航组件 -->
  <header class="bg-surface border-b border-outline/20 h-12 flex items-center justify-between px-4 sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <i data-lucide="cpu" class="w-5 h-5 text-primary"></i>
      <span class="font-bold text-sm text-on-surface">ModBus Master</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs text-on-surface-variant">ModBus 测试工具</span>
    </div>
  </header>
  <!-- @nav:end 导航组件 -->

  <!-- @main-content:start -->
  <main class="flex-1 min-w-0 overflow-hidden" style="height: calc(100vh - 3rem)">
    <div class="flex h-full">
      <!-- 左侧连接面板 -->
      <aside class="w-64 shrink-0 bg-surface border-r border-outline/20 overflow-y-auto">
        <!-- 连接管理区域 -->
      </aside>
      <!-- 右侧主内容区 -->
      <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
        <!-- 标签页管理 + 数据表格 -->
        <div class="flex-1 min-h-0 overflow-y-auto p-4">
          <!-- 数据表格区域 -->
        </div>
        <!-- 日志查看器 -->
        <div class="h-56 shrink-0 bg-surface-container-lowest border-t border-outline/20 overflow-hidden">
          <!-- 日志区域 -->
        </div>
      </div>
    </div>
  </main>
  <!-- @main-content:end -->

  <script>lucide.createIcons();</script>
</body>

</html>
